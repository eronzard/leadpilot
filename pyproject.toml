[project]
name = "leadpilot"
version = "1.0.0"
description = "End-to-end inbound lead automation: webhook intake, enrichment, Claude qualification, CRM sync, routing, reply drafting, retries and a before/after metrics dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.14,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadpilot*"]

[tool.setuptools.package-data]
leadpilot = ["static/*"]
